name: Bug report
description: Something in Tagcrypt does not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please **never paste a secret, passphrase or tag dump** here. This page is public.
        Security problem? Do not use this form. See SECURITY.md.
  - type: input
    id: iphone
    attributes:
      label: iPhone model
      placeholder: iPhone 15
    validations:
      required: true
  - type: input
    id: ios
    attributes:
      label: iOS version
      placeholder: "18.1"
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: App version
      description: Shown in Settings > About Tagcrypt.
      placeholder: "1.1.1"
    validations:
      required: true
  - type: dropdown
    id: tag_type
    attributes:
      label: Tag type
      options:
        - NFC
        - QR
        - Both
        - Not about a tag
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
